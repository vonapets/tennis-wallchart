<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Wallchart</title>
<style>
  :root{
    --bg:#fbfaf8; --card:#fff; --ink:#1a1a1a; --mut:#6b6a68; --line:#e3e0da;
    --accent:#0f766e; --warn:#b45309; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --card:#1c1f25; --ink:#e9e7e3; --mut:#9a9793; --line:#2c3038;
      --accent:#5eead4; --warn:#fbbf24; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --card:#1c1f25; --ink:#e9e7e3; --mut:#9a9793; --line:#2c3038;
    --accent:#5eead4; --warn:#fbbf24; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 80px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--mut);font-size:14px;margin:0 0 22px}
  .sub b{color:var(--ink);font-weight:600}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
         padding:16px 18px;margin:0 0 18px;box-shadow:var(--shadow)}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;
            color:var(--mut);margin:0 0 12px;font-weight:600}
  .rail{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);
        border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip[aria-pressed="true"]{border-color:currentColor;font-weight:600}
  .chip[aria-pressed="false"]{opacity:.42}
  input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);
        border-radius:8px;padding:6px 10px;font-size:13px;min-width:180px;font-family:inherit}
  .views{display:flex;gap:4px;margin:0 0 14px}
  .views button{border:1px solid var(--line);background:var(--card);color:var(--ink);
        padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .views button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
     color:var(--mut);font-weight:600;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .tier{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;
        font-weight:600;color:#fff;white-space:nowrap}
  .tier.lt,.ev.lt{color:#15181d}      /* light fills need dark text, not white */
  .nm{font-weight:600}
  .mut{color:var(--mut);font-size:12.5px}
  .proj{opacity:.62}
  .proj .nm::after{content:" ~";color:var(--warn)}
  .bar{position:relative;height:22px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar span{position:absolute;top:0;bottom:0;border-radius:4px}
  .bar span.p{background-image:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(255,255,255,.45) 4px,rgba(255,255,255,.45) 8px)}
  .mon{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .mon .h{font-size:10px;color:var(--mut);text-align:center;padding:3px 0;text-transform:uppercase}
  .day{min-height:62px;border:1px solid var(--line);border-radius:5px;padding:3px 4px;background:var(--card)}
  .day.out{opacity:.3}
  .day .n{font-size:10px;color:var(--mut)}
  .ev{font-size:10px;border-radius:3px;padding:1px 4px;margin-top:2px;color:#fff;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
        border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700}
  .flag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
  .note{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.55}
  .mhead{font-size:15px;font-weight:600;margin:20px 0 8px}
  @media(max-width:720px){
    .wrap{padding:18px 16px 60px} h1{font-size:21px}
    .hide-s{display:none} .mon{gap:2px} .day{min-height:48px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tennis Wallchart</h1>
  <p class="sub" id="sub"></p>

  <div class="panel">
    <h2>Tiers</h2>
    <div class="rail" id="tierRail"></div>
    <div class="rail" style="margin-top:10px">
      <input type="search" id="q" placeholder="Filter by name or city">
      <button class="chip" id="tourAll" aria-pressed="true">Both tours</button>
      <button class="chip" id="projToggle" aria-pressed="true">Show projected 2027</button>
      <span class="mut" id="count"></span>
    </div>
  </div>

  <div class="views">
    <button data-v="season" aria-pressed="true">Season</button>
    <button data-v="months" aria-pressed="false">Months</button>
    <button data-v="list" aria-pressed="false">List</button>
    <button data-v="picks" aria-pressed="false">Challenger picks</button>
  </div>

  <div id="view"></div>
</div>

const lum = hex => {
  const n = parseInt((hex||'#888').slice(1), 16);
  const f = c => { c/=255; return c<=.03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); };
  return .2126*f(n>>16&255) + .7152*f(n>>8&255) + .0722*f(n&255);
};
const lt = t => lum(col(t)) > 0.42 ? ' lt' : '';
const fmt = d => new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
const fmtY = d => new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});

function rows(){
  const q = state.q.toLowerCase();
  return D.tournaments.filter(r=>{
    // a combined event carries a tier per tour (Indian Wells is ATP 1000 AND
    // WTA 1000). Match on ANY of them, or filtering to "WTA 1000" would drop
    // every combined event onto the ATP side of the rail and hide it.
    const all = r.tiers ? Object.values(r.tiers) : [r.headline_tier || r.tier];
    if(!all.some(t=>state.tiers.has(t))) return false;
    if(!state.proj && r.projected) return false;
    if(q && !((r.name||'')+' '+(r.venue||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function railInit(){
  const el = document.getElementById('tierRail');
  el.innerHTML = ORDER.map(t=>
    `<button class="chip" data-t="${esc(t)}" aria-pressed="${state.tiers.has(t)}">
       <span class="dot" style="background:${col(t)}"></span>${esc(t)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    state.tiers.has(t)?state.tiers.delete(t):state.tiers.add(t);
    b.setAttribute('aria-pressed', state.tiers.has(t));
    render();
  });
}

function season(list){
  if(!list.length) return '<div class="panel mut">Nothing matches those filters.</div>';
  // Each month is its own panel, so each bar is scaled to ITS month. Scaling to
  // the whole window instead makes every bar a 1%-wide sliver pinned to the
  // left edge, which is what this did before.
  const byMonth = {};
  list.forEach(r=>{ (byMonth[r.start.slice(0,7)] ||= []).push(r); });
  return Object.keys(byMonth).sort().map(m=>{
    const label = new Date(m+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
    const [Y0,M0] = m.split('-').map(Number);
    const lo = +new Date(Y0, M0-1, 1), hi = +new Date(Y0, M0, 1);
    const span = Math.max(hi-lo, 1);
    const body = byMonth[m].map(r=>{
      const t = r.headline_tier||r.tier;
      const a0=+new Date(r.start+'T00:00:00'), b0=+new Date((r.end||r.start)+'T00:00:00');
      const a=Math.max(a0,lo), b=Math.min(Math.max(b0,a0+864e5),hi);   // clamp into the month
      const L=Math.max((a-lo)/span*100,0).toFixed(2);
      const W=Math.min(Math.max((b-a)/span*100,2.5),100-L).toFixed(2);
      return `<tr class="${r.projected?'proj':''}">
        <td style="width:120px"><span class="tier${lt(t)}" style="background:${col(t)}">${esc(t)}</span></td>
        <td><span class="nm">${esc(r.name)}</span><div class="mut">${esc(r.venue||'')}</div></td>
        <td class="hide-s" style="width:150px"><span class="mut">${fmt(r.start)} – ${fmt(r.end||r.start)}</span></td>
        <td style="width:42%"><div class="bar"><span class="${r.projected?'p':''}"
            style="left:${L}%;width:${W}%;background:${col(t)}"></span></div></td></tr>`;
    }).join('');
    return `<div class="mhead">${esc(label)}</div><div class="panel" style="padding:10px 14px">
      <table>${body}</table></div>`;
  }).join('');
}

function months(list){
  const byMonth={};
  list.forEach(r=>{ (byMonth[r.start.slice(0,7)] ||= []).push(r); });
  const dows=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return Object.keys(byMonth).sort().map(m=>{
    const [Y,M]=m.split('-').map(Number);
    const first=new Date(Y,M-1,1), last=new Date(Y,M,0);
    let pad=(first.getDay()+6)%7, cells='';
    for(let i=0;i<pad;i++) cells+='<div class="day out"></div>';
    for(let d=1;d<=last.getDate();d++){
      const iso=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const on=list.filter(r=> r.start<=iso && iso<=(r.end||r.start));
      cells+=`<div class="day"><div class="n">${d}</div>`+
        on.slice(0,3).map(r=>{const t=r.headline_tier||r.tier;
          return `<div class="ev${lt(t)}" style="background:${col(t)};${r.projected?'opacity:.6':''}"
                   title="${esc(r.name)}">${esc(r.name)}</div>`;}).join('')+
        (on.length>3?`<div class="n">+${on.length-3}</div>`:'')+`</div>`;
    }
    const label=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    return `<div class="mhead">${esc(label)}</div><div class="panel">
      <div class="mon">${dows.map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></div>`;
  }).join('');
}

function listing(list){
  if(!list.length) return '<div class="panel mut">Nothing matches those filters.</div>';
  return `<div class="panel"><table>
    <tr><th>Tier</th><th>Tournament</th><th class="hide-s">Tours</th><th>Main draw</th><th class="hide-s">Source</th></tr>
    ${list.map(r=>{const t=r.headline_tier||r.tier;return `<tr class="${r.projected?'proj':''}">
      <td><span class="tier${lt(t)}" style="background:${col(t)}">${esc(t)}</span></td>
      <td><span class="nm">${esc(r.name)}</span><div class="mut">${esc(r.venue||'')}</div></td>
      <td class="hide-s mut">${esc((r.tours||[r.tour]).join(' + '))}</td>
      <td>${fmtY(r.start)}<div class="mut">to ${fmt(r.end||r.start)}</div></td>
      <td class="hide-s"><span class="flag">${esc(r.start_source)}</span></td></tr>`}).join('')}
  </table></div>`;
}

function picksView(){
  const P=D.picks;
  if(!P||!P.challenger_picks) return '<div class="panel mut">Run picks.py.</div>';
  const shown=P.challenger_picks.filter(p=>state.proj||!p.projected);
  return `<div class="panel">
    <h2>Challenger picks — ranked</h2>
    <table><tr><th>#</th><th>Tournament</th><th class="hide-s">Week</th><th>Why</th><th>Evidence</th></tr>
    ${shown.map(p=>`<tr class="${p.projected?'proj':''}">
      <td><span class="rank">${p.rank}</span></td>
      <td><span class="tier${lt(p.tier)}" style="background:${col(p.tier)}">${esc(p.tier)}</span>
          <div class="nm" style="margin-top:3px">${esc(p.name)}</div>
          <div class="mut">${esc(p.venue)}</div></td>
      <td class="hide-s mut">${fmtY(p.start)}</td>
      <td class="mut">${p.why.map(esc).join('<br>')}</td>
      <td><span class="flag">[${esc(p.evidence)}] ${esc(p.confidence)}</span></td></tr>`).join('')}
    </table>
    <div class="note"><b>Every Challenger row is <code>[E] none</code>.</b> ${esc(P.caveat)}
    <br><br><b>On the North America factor:</b> ${esc(P.na_premium_caveat)}</div>
  </div>`;
}

function render(){
  const list = rows();
  document.getElementById('count').textContent =
    `${list.length} of ${D.tournaments.length} tournaments`;
  const v = state.view;
  document.getElementById('view').innerHTML =
    v==='season'?season(list): v==='months'?months(list):
    v==='list'?listing(list): picksView();
}

document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>{
  state.view=b.dataset.v;
  document.querySelectorAll('.views button').forEach(x=>
    x.setAttribute('aria-pressed', x===b));
  render();
});
document.getElementById('q').oninput=e=>{state.q=e.target.value;render();};
document.getElementById('projToggle').onclick=e=>{
  state.proj=!state.proj; e.currentTarget.setAttribute('aria-pressed',state.proj); render();};
document.getElementById('tourAll').onclick=e=>{
  const all=new Set(ORDER); const core=new Set(D.core_tiers);
  const isCore=[...state.tiers].every(t=>core.has(t)) && state.tiers.size===core.size;
  state.tiers = isCore? all : new Set(D.default_on);
  document.querySelectorAll('#tierRail button').forEach(b=>
    b.setAttribute('aria-pressed', state.tiers.has(b.dataset.t)));
  render();
};
document.getElementById('sub').innerHTML = D.subtitle;
railInit(); render();
</script>
</body>
</html>
